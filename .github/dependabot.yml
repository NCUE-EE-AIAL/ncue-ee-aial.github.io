# Weekly pull requests for npm packages and GitHub Actions with known fixes; the Check site workflow tests each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    ignore:
      # @astrojs/check (used by `npm run build`) supports TypeScript 5 and 6 only; drop this once it accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
