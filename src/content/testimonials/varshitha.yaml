quote:
  en: "In Professor Yang’s lab, the journey is all about innovation and pushing boundaries. Our projects require us to stay updated with the latest advancements in AI, which is both exciting and challenging. One of the highlights of my experience was attending an international AI conference, where I presented our project on autonomous vehicles. The lab provided comprehensive support, from helping with presentation skills to refining our technical contributions. I have learned not only about algorithms and neural networks but also about project management and teamwork. Our professor encourages us to look at problems from multiple angles, making it a dynamic and stimulating environment to work in. The lab’s culture of inclusivity, collaboration, and rigorous research has broadened my perspective, allowing me to understand AI’s impact on society."
