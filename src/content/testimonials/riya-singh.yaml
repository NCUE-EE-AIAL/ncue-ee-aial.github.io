name: "Riya Singh"
program: TEEP
photo: "/images/people/riya-singh.webp"
quote:
  en: "Being part of Professor Wen Ren Yang’s AI Application Lab has been an immersive learning experience. I was initially drawn to the lab’s focus on applying AI in meaningful ways, and my time here has exceeded expectations. We are encouraged to attend workshops and lectures led by visiting professors and industry leaders, which has enhanced my understanding of AI’s evolving landscape. One of my most valuable experiences was contributing to an AI-powered image recognition project. The lab's collaborative environment fosters curiosity, making it a space for continuous improvement and exploration. Professor Yang’s mentorship has empowered me to take on challenges and embrace problem-solving. I am grateful for the lab’s supportive atmosphere, where learning extends beyond AI, preparing us for a future where AI plays a central role in technology."
order: 12
