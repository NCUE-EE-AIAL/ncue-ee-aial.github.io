name: "Monica"
program: TEEP
photo: "/images/people/monica.webp"
quote:
  en: "Working with Professor Wen Ren Yang’s AI Application Lab for the past six months has been an enriching experience that deepened my understanding of applied AI. I was initially drawn to the lab for its focus on impactful, real-world AI applications, and the experience has far surpassed my expectations. Through hands-on involvement in an AI-powered image recognition project, I gained practical skills and insights, especially within the lab's collaborative, curiosity-driven environment. Attending workshops and lectures by visiting professors and industry leaders further expanded my perspective on AI's rapidly evolving landscape. Professor Yang’s mentorship has encouraged me to tackle complex challenges, enhancing my problem-solving abilities. I’m grateful for the lab’s supportive and forward-looking atmosphere, where I’ve learned not only about AI but also about the skills essential for a future shaped by technology"
order: 10
