quote:
  en: "Being part of Professor Wen Ren Yang’s AI lab has offered me hands-on experience that goes far beyond what I’d learn in a classroom. We work in small, diverse teams to create and test AI applications, which has taught me the importance of adaptability and cross-cultural collaboration. One memorable project involved developing a smart health monitoring system, where our team included members from multiple countries. This project helped me grow my technical skills while learning how to communicate effectively across cultures. Our professor’s mentorship has been invaluable; he pushes us to think critically and refine our approaches, encouraging both independence and teamwork. Additionally, the lab arranges workshops with industry experts, which has broadened my understanding of real-world AI applications. This experience has built a strong foundation for my career, equipping me with both technical knowledge and a global perspective."
order: 19
