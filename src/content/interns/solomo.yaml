quote:
  en: "My journey in Professor Yang’s AI Application Lab has been an immersive learning experience that constantly challenges me. The lab emphasizes practical applications of AI, encouraging us to tackle real-world problems with innovative solutions. One of the projects I worked on involved using AI to analyze climate data, helping us predict environmental trends. The experience was not only technically challenging but also profoundly impactful. Professor Yang’s guidance has been crucial, as he always inspires us to approach problems from new angles and think creatively. The lab’s collaborative culture is one of my favorite aspects—our team members come from diverse backgrounds, and each brings unique strengths. The exposure to interdisciplinary knowledge and real-world impact has helped me grow immensely, both as a researcher and as an individual dedicated to making a difference through AI."
order: 20
