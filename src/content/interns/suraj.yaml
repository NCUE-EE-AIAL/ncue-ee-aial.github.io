quote:
  en: "“In Professor Yang’s lab, innovation and pushing boundaries are at the forefront of everything we do. Staying updated with the latest AI advancements is essential, which makes the work both exciting and challenging. One of my highlights was presenting our autonomous vehicle project at an international AI conference. The lab supported us with every aspect of our presentation, from refining our technical content to polishing our presentation skills. Here, I’ve learned so much—not only about algorithms and neural networks, but also about teamwork and project management. Professor Yang encourages us to view problems from multiple perspectives, creating a dynamic and stimulating environment for research. The lab’s culture of inclusivity and collaboration has broadened my understanding of AI's societal impact and provided me with a holistic view of the field.”"
