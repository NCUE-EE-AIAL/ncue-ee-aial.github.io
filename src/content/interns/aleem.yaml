quote:
  en: "Being part of Professor Wen Ren Yang's Artificial Intelligence Application Lab has been transformative for my growth in both technical and interpersonal skills. I came into the lab with a strong interest in AI but minimal experience in applying these theories to real-world scenarios. Collaborating on projects, I’ve developed valuable AI models and learned to communicate complex concepts in simple terms. Our team’s diversity has been inspiring, as everyone brings unique insights that enhance our work. One of my most memorable experiences was co-developing a predictive AI model for healthcare. The project was challenging, but with the support and guidance of Professor Yang and my teammates, we achieved results that exceeded our expectations. The lab’s structure, with weekly presentations and feedback sessions, has allowed me to constantly improve and refine my approach. More than just a research space, this lab is a community of learning and growth"
order: 21
