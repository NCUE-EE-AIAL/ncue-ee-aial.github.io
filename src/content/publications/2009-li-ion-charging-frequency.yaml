summary:
  en: "Finds the best charging frequency for Li-ion batteries by AC impedance measurement: it is the frequency of minimum impedance, and charging there improves charging time and efficiency by about 30%."
  zh: "以交流阻抗法找出鋰電池的最佳充電頻率，也就是阻抗最小的頻率點；以此頻率充電，充電時間與效率都改善約 30%。"
