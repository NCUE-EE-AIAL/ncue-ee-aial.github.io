summary:
  en: "Builds a physics-guided digital twin of a campus PV system with low-cost ESP32 and LoRa sensors: a physics model gives the theoretical output, an LSTM forecasts current harmonics (RMSE about 1.90), and the gap between the twin and the inverter flags faults such as thermal derating and cloud shading."
  zh: "以低成本 ESP32 與 LoRa 感測器建構校園太陽能系統的物理導引數位孿生：物理模型算出理論發電量，LSTM 預測電流諧波（RMSE 約 1.90），再由孿生模型與實際換流器輸出的差距找出熱降載、雲遮等異常。"
