summary:
  en: "Models the magnetic coupling of a contactless power transmission system, compares converter topologies and compensation circuits to choose the main circuit, and confirms a design that delivers 31 V at 11 A."
  zh: "建立非接觸式電能傳輸的磁耦合模型，比較各種轉換器與補償電路以決定主電路架構，並驗證輸出 31 V、11 A 的系統。"
