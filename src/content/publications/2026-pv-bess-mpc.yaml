summary:
  en: "Schedules a solar-plus-battery system with model predictive control that raises self-consumption while limiting battery degradation and grid congestion. One-year simulations compare it with conventional rules and test how forecast errors affect it, with tightened constraints to absorb them."
  zh: "以模型預測控制排程太陽能加儲能系統，在提高自發自用率的同時減少電池劣化與電網壅塞；以一年期模擬與傳統方法比較，並分析預測誤差的影響，以收緊限制條件因應。"
