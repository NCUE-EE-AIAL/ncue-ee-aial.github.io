summary:
  en: "Measures the area of the marks that test needles leave on wafer pads from high-magnification microscope images, replacing the manual practice of drawing an oval around each mark; the method is faster, more accurate and does not vary from person to person."
  zh: "以高倍率顯微影像計算探針測試後在晶圓銲墊上留下的針痕面積，取代人工畫橢圓估算的做法，速度更快、更準確，也不會因人而異。"
