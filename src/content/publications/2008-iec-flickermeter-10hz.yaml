summary:
  en: "Examines the ΔV10 method, used for decades in several Asian countries to rate voltage flicker and unchanged since 1978, against the IEC flickermeter standard, and shows where its readings become unreliable."
  zh: "以 IEC 閃爍計標準檢視亞洲多國沿用數十年、1978 年後未曾更新的 ΔV10 電壓閃爍量測法，指出其量測結果不可靠之處。"
