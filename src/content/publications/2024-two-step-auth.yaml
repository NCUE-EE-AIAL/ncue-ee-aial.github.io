# summary: written from the abstract on the publisher page (url above), 2026-10-24
summary:
  en: "Combines face and voice recognition into a low-cost authentication system for a small group that needs only a camera and a microphone: a face model identifies the user, then a speaker model verifies the voice. Code and models are public."
  zh: "結合人臉與聲音辨識，為小團體打造只需攝影機與麥克風的低成本身分驗證：人臉模型先辨識使用者，語者模型再驗證聲音。程式碼與模型皆公開。"
