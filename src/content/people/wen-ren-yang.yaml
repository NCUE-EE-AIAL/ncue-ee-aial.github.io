bio:
  en: "Associate Professor in the Department of Electrical Engineering, NCUE, since 2006. B.S. in electrical engineering from National Taiwan University of Science and Technology (1998); M.S. (2002) and Ph.D. (2006) in electrical engineering from the University of Missouri-Columbia. His work combines wavelet-based signal analysis, digital signal processing and power electronics with neural networks, applied to power quality, energy storage, industrial IoT and embedded recognition."
  zh: "國立彰化師範大學電機工程學系副教授，2006 年起任教。國立臺灣科技大學電機工程學士（1998），美國密蘇里大學哥倫比亞分校電機工程碩士（2002）、博士（2006）。研究結合小波轉換訊號分析、數位訊號處理與電力電子，搭配類神經網路，應用於電力品質、儲能系統、工業物聯網與嵌入式辨識。"
