<!-- Shared patterns and the vignette mask, inlined once per page by Base.astro. Colours come from the .art rules in global.css. -->
<svg class="art art-defs" aria-hidden="true" focusable="false" width="0" height="0">
<defs>
<pattern id="art-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="dot" cx="10" cy="10" r="1.1"></circle></pattern>
<pattern id="art-holes" width="12" height="12" patternUnits="userSpaceOnUse"><rect class="hole" x="3.5" y="3.5" width="5" height="5" rx="1"></rect></pattern>
<radialGradient id="art-fade"><stop class="fade-in" offset="0.5"></stop><stop class="fade-out" offset="1"></stop></radialGradient>
<mask id="art-vignette" maskContentUnits="objectBoundingBox"><rect class="fade" width="1" height="1"></rect></mask></defs></svg>
